apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-be-prod-to-redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: be-prod
      ports:
        - protocol: TCP
          port: 6379
