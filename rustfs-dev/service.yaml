apiVersion: v1
kind: Service
metadata:
  name: rustfs
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: rustfs-dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: rustfs-dev
  ports:
    - name: endpoint
      protocol: TCP
      port: 9000
      targetPort: endpoint
    - name: console
      protocol: TCP
      port: 9001
      targetPort: console
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-headless
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: rustfs-dev
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: rustfs-dev
  ports:
    - name: endpoint
      protocol: TCP
      port: 9000
      targetPort: endpoint
    - name: console
      protocol: TCP
      port: 9001
      targetPort: console
