---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: rustfs-secrets
  namespace: rustfs-dev
spec:
  encryptedData:
    RUSTFS_ACCESS_KEY: 
    RUSTFS_ADDRESS: 
    RUSTFS_CONSOLE_ADDRESS: 
    RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: 
    RUSTFS_CONSOLE_ENABLE: 
    RUSTFS_CORS_ALLOWED_ORIGINS: 
    RUSTFS_OBS_ENVIRONMENT: 
    RUSTFS_OBS_LOG_DIRECTORY: 
    RUSTFS_OBS_LOGGER_LEVEL: 
    RUSTFS_REGION: 
    RUSTFS_SECRET_KEY: 
    RUSTFS_VOLUMES: 
  template:
    metadata:
      name: rustfs-secrets
      namespace: rustfs-dev
    type: Opaque
