apiVersion: v1
kind: Service
metadata:
  name: rustfs-console-debug-nodeport
  namespace: rustfs-dev
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: rustfs-dev
    app.kubernetes.io/component: debug-access
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: rustfs-dev
  ports:
    - name: console
      protocol: TCP
      port: 9001
      targetPort: console
      nodePort: 30901
