apiVersion: v1
kind: Secret
metadata:
  name: rustfs-secrets
  namespace: rustfs-dev
type: Opaque
stringData:
  RUSTFS_ADDRESS: ":9000"
  RUSTFS_CONSOLE_ADDRESS: ":9001"
  RUSTFS_CORS_ALLOWED_ORIGINS: "http://localhost:3000,https://dev.techtaurant.com,https://poc-api.techtaurant.com"
  RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "http://localhost:3000,https://dev.techtaurant.com,https://poc-api.techtaurant.com"
  RUSTFS_CONSOLE_ENABLE: "true"
  RUSTFS_OBS_ENVIRONMENT: "techtaurant-dev"
  RUSTFS_OBS_LOG_DIRECTORY: "/logs"
  RUSTFS_OBS_LOGGER_LEVEL: "info"
  RUSTFS_REGION: "ap-northeast-2"
  RUSTFS_VOLUMES: "/data"
  RUSTFS_ACCESS_KEY: "replace-me-rustfs-access-key"
  RUSTFS_SECRET_KEY: "replace-me-rustfs-secret-key"
