apiVersion: v1
kind: Service
metadata:
  name: rustfs-nodeport
  namespace: rustfs-dev
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: rustfs-dev
    app.kubernetes.io/component: public-endpoint
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: rustfs-dev
  ports:
    - name: endpoint
      protocol: TCP
      port: 9000
      targetPort: endpoint
      nodePort: 30900
