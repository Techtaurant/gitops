apiVersion: v1
kind: Secret
metadata:
  name: techtaurant-be-env
  namespace: be-dev
type: Opaque
stringData:
  APP_NAME: techtaurant-be
  APP_ENVIRONMENT: dev
  SERVER_PORT: "8080"
  LOG_LEVEL: INFO
  DB_HOST: postgres.postgres-dev.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: techtaurant
  DB_USERNAME: techtaurant
  DB_PASSWORD: replace-me
  GOOGLE_CLIENT_ID: replace-me
  GOOGLE_CLIENT_SECRET: replace-me
  JWT_SECRET: replace-me-with-at-least-32-bytes
  JWT_ACCESS_TOKEN_EXPIRE_MS: "3600000"
  JWT_REFRESH_TOKEN_EXPIRE_MS: "604800000"
  CORS_ORIGINS: "http://localhost:3000,https://dev.techtaurant.com"
  COOKIE_SECURE: "true"
  COOKIE_HTTP_ONLY: "true"
  COOKIE_SAME_SITE: None
  COOKIE_PATH: /
  SWAGGER_BASE_URL: https://poc-api.techtaurant.com
  AWS_REGION: ap-northeast-2
  AWS_S3_ENDPOINT: http://rustfs.rustfs-dev.svc.cluster.local:9000
  AWS_S3_PRESIGN_ENDPOINT: https://dev-s3.techtaurant.com
  AWS_S3_PATH_STYLE_ACCESS: "true"
  AWS_S3_BUCKET_NAME: techtaurant-media-dev
  AWS_S3_PRESIGNED_URL_EXPIRE_MINUTES: "15"
  AWS_ACCESS_KEY_ID: replace-me-rustfs-access-key
  AWS_SECRET_ACCESS_KEY: replace-me-rustfs-secret-key
  MONITORING_METRICS_USERNAME: prometheus
  MONITORING_METRICS_PASSWORD: replace-me
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring.svc.cluster.local:4317
