apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: techtaurant
  namespace: argocd
spec:
  description: Techtaurant GitOps applications
  sourceRepos:
    - https://github.com/Techtaurant/gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: redis-dev
    - server: https://kubernetes.default.svc
      namespace: redis-prod
    - server: https://kubernetes.default.svc
      namespace: be-dev
    - server: https://kubernetes.default.svc
      namespace: be-prod
    - server: https://kubernetes.default.svc
      namespace: postgres-dev
    - server: https://kubernetes.default.svc
      namespace: postgres-prod
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.com
spec:
  project: techtaurant
  source:
    repoURL: https://github.com/Techtaurant/gitops.git
    targetRevision: HEAD
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
